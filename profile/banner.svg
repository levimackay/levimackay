<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-label="Levi Mackay  Software Engineer">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#000000">
        <animate attributeName="stop-color" values="#000000;#001a0d;#000000" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#001a0d">
        <animate attributeName="stop-color" values="#001a0d;#003320;#001a0d" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#00FF9D">
        <animate attributeName="stop-color" values="#00FF9D;#00cc7d;#00FF9D" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="textGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#00FF9D"/>
      <stop offset="100%" stop-color="#ffffff"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-1 0" to="1 0" dur="4s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#00FF9D" stroke-width="0.3" opacity="0.15"/>
    </pattern>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#grid)"/>

  <!-- Scan line -->
  <rect x="0" y="0" width="1200" height="2" fill="#00FF9D" opacity="0.4">
    <animate attributeName="y" values="0;320;0" dur="5s" repeatCount="indefinite"/>
  </rect>

  <!-- Corner brackets -->
  <path d="M 40 40 L 40 80 L 80 80" fill="none" stroke="#00FF9D" stroke-width="2" opacity="0.8"/>
  <path d="M 1160 40 L 1160 80 L 1120 80" fill="none" stroke="#00FF9D" stroke-width="2" opacity="0.8"/>
  <path d="M 40 280 L 40 240 L 80 240" fill="none" stroke="#00FF9D" stroke-width="2" opacity="0.8"/>
  <path d="M 1160 280 L 1160 240 L 1120 240" fill="none" stroke="#00FF9D" stroke-width="2" opacity="0.8"/>

  <!-- Status pill -->
  <rect x="420" y="36" width="360" height="36" rx="18" fill="#000000" stroke="#00FF9D" stroke-width="1.5" opacity="0.9"/>
  <circle cx="442" cy="54" r="6" fill="#00FF9D">
    <animate attributeName="opacity" values="1;0.3;1" dur="1.2s" repeatCount="indefinite"/>
  </circle>
  <text x="600" y="59" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#00FF9D" letter-spacing="2">OPEN TO WORK · SUMMER 2027</text>

  <!-- Name -->
  <text x="600" y="155" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="72" font-weight="700" fill="url(#textGlow)" filter="url(#glow)">Levi Mackay</text>

  <!-- Tagline -->
  <text x="600" y="200" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" fill="#aaaaaa" letter-spacing="1">Software Engineer · Builder · Open Source Maintainer</text>

  <!-- Metrics bar -->
  <text x="600" y="260" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#00FF9D">
    <tspan fill="#ffffff">3.98 GPA</tspan>
    <tspan fill="#333333">  ·  </tspan>
    <tspan fill="#ffffff">2,100+ commits</tspan>
    <tspan fill="#333333">  ·  </tspan>
    <tspan fill="#ffffff">36 Lydia</tspan>
    <tspan fill="#333333">  ·  </tspan>
    <tspan fill="#ffffff">52 repos</tspan>
  </text>

  <!-- Blinking cursor -->
  <text x="600" y="295" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#00FF9D">
    <tspan>ready to ship_</tspan>
    <tspan opacity="1">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </tspan>
  </text>
</svg>
